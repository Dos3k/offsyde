[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "offsyde"
version = "0.1.0"
description = "Ask football data questions in plain English or German. Local LLM (Ollama) + text-to-SQL with guardrails."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "httpx>=0.27",
    "sqlglot>=25",
    "rapidfuzz>=3.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
offsyde = "offsyde.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/offsyde"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
