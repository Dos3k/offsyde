<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offsyde</title>
<style>
  :root {
    --bg: #f6f7f4; --card: #ffffff; --ink: #14201a; --muted: #5b6b62; --line: #dfe4de;
    --accent: #0b6b3a; --accent-ink: #ffffff; --warn: #9a5b00; --code: #eef1ec;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1511; --card: #151e19; --ink: #e8efe9; --muted: #93a499; --line: #26332b;
            --accent: #3ec17a; --accent-ink: #06130c; --warn: #f0b04a; --code: #1b2620; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
          background: var(--card); color: var(--ink); font: inherit; min-width: 0; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { padding: 12px 18px; border-radius: 10px; border: 0; background: var(--accent);
           color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .55; cursor: wait; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 28px; }
  .chip { background: var(--card); color: var(--ink); border: 1px solid var(--line);
          font-weight: 400; padding: 6px 12px; border-radius: 999px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 18px 20px; margin-bottom: 14px; }
  .q { color: var(--muted); font-size: 14px; margin: 0 0 6px; }
  .answer { font-size: 18px; margin: 0; white-space: pre-wrap; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 10px; display: flex; gap: 12px;
          flex-wrap: wrap; }
  .badge { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  pre { background: var(--code); padding: 12px; border-radius: 8px; overflow-x: auto;
        font-size: 13px; margin: 8px 0 0; }
  .tablewrap { overflow-x: auto; margin-top: 8px; }
  table { border-collapse: collapse; font-size: 14px; width: 100%; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  .err { color: var(--warn); }
  footer { color: var(--muted); font-size: 12px; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <h1>Offs<span>y</span>de</h1>
  <p class="sub">Ask about football matches in English or German. Answers come from SQL over real event data.</p>
  <p class="sub" id="loaded" style="margin-top:-14px;font-size:14px"></p>
  <form id="f">
    <input id="q" autocomplete="off" maxlength="500" placeholder="Who scored the most goals?" aria-label="Your question" required>
    <button id="go">Ask</button>
  </form>
  <div class="chips" id="chips"></div>
  <div id="out"></div>
  <footer>Data: StatsBomb open data. Answers are generated by a local LLM; the SQL and raw rows are shown so you can check them.</footer>
</main>
<script>
const examples = [
  "Who scored the most goals for Barcelona in 2019/20?",
  "Wie viele Tore hat Messi in der Saison 2019/20 erzielt?",
  "How many points did Leverkusen collect away from home?",
  "Which player made the most progressive passes in 2023/24?",
  "How many matches did Barcelona win in 2018/19?"
];
async function readJson(r) {
  const body = await r.text();
  try { return JSON.parse(body); } catch { return {detail: body.slice(0, 200) || r.statusText}; }
}
fetch("/api/datasets").then(async r => {
  const d = await readJson(r);
  if (!r.ok) {
    const el = document.getElementById("loaded");
    el.textContent = "Setup problem: " + (d.detail || r.statusText);
    el.style.color = "#e5a000";
    return [];
  }
  return d;
}).then(d => {
  if (d.length) document.getElementById("loaded").textContent =
    "Loaded: " + d.map(x => `${x.competition} ${x.season} (${x.matches} matches)`).join(" · ");
}).catch(() => {});
const out = document.getElementById("out"), q = document.getElementById("q"),
      go = document.getElementById("go"), chips = document.getElementById("chips");
examples.forEach(t => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = t;
  b.onclick = () => { q.value = t; ask(t); };
  chips.appendChild(b);
});
document.getElementById("f").onsubmit = e => { e.preventDefault(); ask(q.value); };

function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach(k => n.append(k));
  return n;
}
function table(cols, rows) {
  const t = el("table");
  t.append(el("thead", {}, el("tr", {}, ...cols.map(c => el("th", {textContent: c})))));
  t.append(el("tbody", {}, ...rows.slice(0, 50).map(r =>
    el("tr", {}, ...r.map(v => el("td", {textContent: v === null ? "" : String(v)}))))));
  return el("div", {className: "tablewrap"}, t);
}
async function ask(question) {
  go.disabled = true;
  const card = el("div", {className: "card"}, el("p", {className: "q", textContent: question}),
                  el("p", {className: "answer", textContent: "Thinking…"}));
  out.prepend(card);
  try {
    const r = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"},
                                       body: JSON.stringify({question})});
    const d = await readJson(r);
    if (!r.ok) throw new Error(d.detail || r.statusText);
    card.querySelector(".answer").textContent = d.answer;
    const meta = el("div", {className: "meta"},
      el("span", {textContent: `${Math.round(d.latency_ms)} ms`}),
      el("span", {textContent: `${d.attempts} attempt${d.attempts === 1 ? "" : "s"}`}));
    if (d.answer_source === "template")
      meta.append(el("span", {className: "badge warn", textContent: d.grounded ? "shown as data" : "model wording rejected: numbers not in data"}));
    if (d.entities.length)
      meta.append(el("span", {textContent: "matched: " + d.entities.map(e => e.name).join(", ")}));
    card.append(meta);
    if (d.sql) {
      const det = el("details", {}, el("summary", {textContent: `SQL and ${d.row_count} row${d.row_count === 1 ? "" : "s"}`}),
                     el("pre", {textContent: d.sql}));
      if (d.rows.length) det.append(table(d.columns, d.rows));
      card.append(det);
    }
  } catch (err) {
    card.querySelector(".answer").className = "answer err";
    card.querySelector(".answer").textContent = "Error: " + err.message;
  } finally { go.disabled = false; }
}
</script>
</body>
</html>
